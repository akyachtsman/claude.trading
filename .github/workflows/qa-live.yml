# qa-live.yml — a CALLER of claude.directives' shared-qa-live.yml (#460 step 4
# pilot, 2026-10-26), pinned to the moving release tag @v1: Playwright against
# the live deployed URL, after GitHub Pages deploys or by hand. The shared
# workflow reads its composites and scripts from claude.directives at the
# called commit and prints "Shared files: akyachtsman/claude.directives@<sha>".
# It carries the full copy's concurrency on its suite job, so this caller needs
# none. How it works: claude.directives docs/internal/shared-workflows.md.
#
# ⚠️ Keep this caller through every /refresh-repo: "pilot of #460 step 4".
#
# ⚠️ RULE W2 — Pages has two sources and only one name is ours to pre-fill.
# This project is branch-source (the managed pages-build-deployment). If it
# ever moves to "GitHub Actions", ADD the deploy workflow's exact `name:` to the
# list below; never replace. Why: docs/standards/automations.md -> Watcher
# Rules (W2).
#
# Required setup: the APP_URL repository variable (the live URL) and, for the
# gated scenarios, the TEST_AUTH_CREDENTIAL secret.

name: QA — UI Tests (live)

on:
  workflow_run:
    # + 'Pages Deploy' (pages-deploy.yml), or your own deploy's `name:`, on Actions-source
    workflows: ['pages-build-deployment']
    types: [completed]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Override live app URL (optional)'
        required: false

# Least privilege: read the repo and run tests against the live URL.
# `actions: read` is for the shared published-lookup job: a called workflow
# can only narrow the caller's token, never widen it.
permissions:
  contents: read
  actions: read

jobs:
  live:
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa-live.yml@v1
    with:
      tests-dir: .github/scripts/ui-tests
      app-url: ${{ inputs.app_url }}
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
