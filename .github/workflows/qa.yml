# qa.yml — a CALLER of claude.directives' shared-qa.yml (#460 step 4 pilot,
# 2026-10-26), pinned to the moving release tag @v1. The shared workflow runs
# the secret-scan composite, the contrast guardrail (Static Checks) and the
# Playwright suite against a local server (UI Tests), reading every shared
# composite and script from claude.directives at the called commit; each of its
# jobs prints "Shared files: akyachtsman/claude.directives@<sha>". In this run a
# called job shows as "qa / Static Checks" and "qa / UI Tests (local server)".
# How it works and what a project keeps: claude.directives
# docs/internal/shared-workflows.md. Rollback is reverting the PR that made
# this a caller, which restores the full copy.
#
# ⚠️ Keep this caller through every /refresh-repo: "pilot of #460 step 4". The
# deleted composites (.github/actions/secret-scan, .github/actions/ui-suite)
# and scripts (check-ui-viewports.js, check-contrast.js, package-lock.json) must
# not be offered back.
#
# Jobs:
#   project-checks — this repo's own static checks (extended secret scan,
#                    html-validate), which used to be steps in Static Checks.
#                    `qa` needs it, so a red project check still stops the suite.
#   qa             — the shared workflow (Static Checks, then UI Tests).
#   ⚠️ LOCAL ADDITIONS: news-checks (every trigger), ui-changes (kept ONLY
#   because its news_client output gates news-client-mutants), news-client-mutants
#   and notify. See each job.
#
# Contrast: .github/scripts/check-contrast.js was byte-identical to the shared
# copy, so it is deleted and no `contrast-script` is passed; the shared step
# runs the same pairs against styles/tokens.css.

name: QA — Static + UI Tests

on:
  pull_request:
    branches: [main]
  # push covers only main (the post-merge run). Feature-branch commits are
  # covered by the pull_request trigger — listing them here too made every
  # PR commit run the whole workflow twice. Accepted trade-off: commits
  # pushed before a PR exists get no run; the draft-PR-immediately flow
  # makes that window moments.
  push:
    branches: [main]
  # Manual escape hatch: pull_request event delivery can die provider-side
  # (observed 2026-07-19) — this lets a session or the Actions tab run the
  # gate by hand on any ref. A dispatch run on the PR's head SHA satisfies
  # the merge gate. See docs/standards/ci-triage.md → "CI never registered".
  workflow_dispatch:

# ⚠️ LOCAL ADDITION — not in the upstream template. Keep it on every refresh.
# Supersede in-flight runs for the same PR (or ref): a push while CI is running
# otherwise leaves two suites racing, and the older one's result is noise that
# can land AFTER the newer one and read as the current verdict.
concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo and run tests.
permissions:
  contents: read

env:
  # Read by this file's own jobs (project-checks, ui-changes,
  # news-client-mutants). A called workflow does not see `env`, so the same
  # values go to `qa` as inputs below: keep the two in step.
  UI_TESTS_DIR: .github/scripts/ui-tests
  BUILD_CMD: ''
  SITE_DIR: '.'
  # Extended regex of the build INPUTS. Not read by the shared workflow: the
  # toolkit's Pages edit reminder reads it here to know which edits change the
  # deployed site (ui-changes also appends it to UI_PATHS). Empty: no build.
  BUILD_PATHS: ''

jobs:
  # ⚠️ LOCAL ADDITION — this repo's own checks, moved out of Static Checks into
  # a sibling job of `qa` (the slot shared-qa.yml's header documents).
  project-checks:
    name: Project Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Extended secret scan (upstream pattern gap, reported for the Downstream-Finding Loop)
      # The shared secret-scan composite is byte-locked to the canonical pattern, which has no
      # entry for this project's own token shapes (Anthropic, Supabase secret,
      # GitHub PATs, JWTs, private keys) and skips *.sql/*.py/*.jsonl by extension.
      # `git grep` covers every TRACKED file whatever its type, and its exit codes
      # separate clean (1) from a failed run (>=2), which `xargs grep` cannot.
      # `-l` is a security property, as in the composite: a committed token is not a
      # registered secret, so echoing the matched line would publish it in the log.
      # The public Supabase key is `sb_publishable_…`, which matches none of these,
      # so nothing needs excluding; a legacy JWT-format anon key would trip the JWT
      # alternative and fail loudly rather than be waved through — the safe direction.
      - name: Extended secret scan (all tracked files)
        run: |
          rc=0
          hits=$(git grep -IlE \
            -e 'sk-ant-[A-Za-z0-9_-]{20,}' \
            -e 'sb_secret_[A-Za-z0-9_-]{20,}' \
            -e 'ghp_[A-Za-z0-9]{30,}' \
            -e 'github_pat_[A-Za-z0-9_]{30,}' \
            -e 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' \
            -e '-----BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY-----') || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "ERROR: potential secret found in these tracked files:"
            printf '%s\n' "$hits"
            echo "The matching line is deliberately not printed — a committed token is not masked in logs."
            exit 1
          elif [ "$rc" -ge 2 ]; then
            echo "ERROR: extended secret scan did not run (git grep exit $rc)"
            exit 1
          fi

      # ⚠️ LOCAL ADDITION — CLAUDE.md → Required Commands lists `npx html-validate
      # index.html`, but no CI step ran it. Pinned through the ui-tests lockfile
      # (devDependency) rather than `npx html-validate@x`, so the whole tool tree is
      # reproducible; `--ignore-scripts` because nothing here needs a postinstall.
      # Node 22 is required by html-validate 11 (engines ^22.22.0) and last in the job
      # so it cannot change the runtime of the scan above.
      - name: Setup Node (html-validate)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate HTML
        run: |
          npm ci --ignore-scripts --prefix "$UI_TESTS_DIR"
          npx --prefix "$UI_TESTS_DIR" html-validate index.html

  qa:
    needs: [project-checks]
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa.yml@v1
    with:
      # The env values above, as inputs (a called workflow does not see `env`).
      tests-dir: .github/scripts/ui-tests
      build-cmd: ''
      site-dir: '.'
      # S10, S11 and S14 need the live backend (a PR runner cannot reach
      # Supabase); qa-live.yml runs them. shared-qa.yml exports this input to
      # its UI job as GREP_INVERT (v1.0.3, claude.directives #484), and
      # playwright.config.js turns that into `grepInvert`.
      grep-invert: live only
      # The web guards (claude.directives v1.1.0) flag four native confirm()
      # calls in scripts/app.js. The page does not load styles/components.js
      # yet, so House.confirm is not there to call: this skip is removed by
      # the house-style move (/design-intake), which replaces them.
      guard-skip: |
        native-dialog:scripts/app.js
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}

  # ⚠️ LOCAL ADDITION — not in the upstream template. Keep it on every refresh.
  # The News topic AI helper's server and database harnesses (owner 2026-10-19:
  # "yes" to running them in CI; until then they ran only by hand). Cheap and
  # path-independent, so they run on every trigger, like static-checks:
  #   news-topic-check.mjs --mutants  desk-news against the committed source in a
  #                                   vm with stubbed collaborators, then every
  #                                   single-edit mutant must be caught (exit 1
  #                                   on a failed check, a surviving or an
  #                                   INVALID mutant — a moved anchor is a fix
  #                                   to the harness, not a flake)
  #   news-ai-quota-check.py          desk_023 on a SCRATCH Postgres (the service
  #                                   container below — never a Supabase
  #                                   project): the verify probe, a 20-way burst
  #                                   proving the counter atomic, Ask's counter
  #                                   independent, then 12 migration mutants
  # The page's half (S75 under 41 mutants) is the news-client-mutants job.
  news-checks:
    name: News helper checks (server + database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the pinned esbuild
        run: npm ci --prefix tools

      - name: desk-news checks and mutants
        run: node tools/news-topic-check.mjs --mutants

      - name: desk_023 on a scratch Postgres, burst and mutants
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
        run: python3 tools/news-ai-quota-check.py

  # ⚠️ LOCAL ADDITION — not in the upstream template. Keep it on every refresh.
  # The no-browser checks of the edge functions and scripts/data.js, on every
  # trigger (a PR that edits only supabase/ or tools/ skips the browser suite,
  # so nothing else would run them). Nothing here reaches the network or a
  # Supabase project: every function is transpiled with the pinned esbuild and
  # run in a `vm` context with `fetch` stubbed.
  #   tools/unit/*.test.mjs        node:test unit tests of the functions' internal
  #                                helpers and data.js (a known bug is a `todo`
  #                                test: reported, not failing)
  #   econ-check.mjs --mutants     desk-econ, then its mutants must each be caught
  #   ask-gate-check.mjs --mutants desk-ask's three doors, the open cap, the tier
  #   ask-model-parity.mjs         the model list is one list in three files
  #   watchlist-scan --selftest    the morning scan's own selftest, and its mutants
  server-checks:
    name: Server and data unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the pinned esbuild
        run: npm ci --prefix tools

      - name: Unit tests (tools/unit)
        run: node --test 'tools/unit/*.test.mjs'

      - name: desk-econ checks and mutants
        run: node tools/econ-check.mjs --mutants

      - name: desk-ask gate checks and mutants
        run: node tools/ask-gate-check.mjs --mutants

      - name: Ask model list parity
        run: node tools/ask-model-parity.mjs --selftest && node tools/ask-model-parity.mjs

      - name: Morning scan selftest and mutants
        run: node tools/watchlist-scan.mjs --selftest && node tools/watchlist-scan-mutants.mjs

  ui-changes:
    name: Detect UI-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.diff.outputs.ui }}
      # ⚠️ LOCAL ADDITION — see the news-client-mutants job.
      news_client: ${{ steps.news.outputs.run }}

    steps:
      - name: Checkout (full history for base diff)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deploy parity that must not depend on the diff: the browser job is
      # skipped on a PR touching no UI path, but a symlink added anywhere in
      # an unbuilt site (notes.md, a .png) still fails pages-deploy.yml. So
      # without a build the symlink check runs here, on every PR; with one,
      # the browser job checks the built output (it always runs then).
      - name: Symlinks in the unbuilt site
        if: env.BUILD_CMD == ''
        run: |
          src="${SITE_DIR%/}"; [ -n "$src" ] || src="."
          [ -d "$src" ] || exit 0
          deploy=0; [ -f .github/workflows/pages-deploy.yml ] && deploy=1
          # Resolve the root BEFORE entering it: a SITE_DIR that links outside
          # the repository is what pages-deploy.yml refuses, and following it
          # would scan runner files instead. An in-repository link is fine.
          ws=$(realpath -e .)
          real=$(realpath -e -- "$src")
          case "$real/" in
            "$ws"/*) ;;
            *) if [ "$deploy" = 1 ]; then
                 echo "::error::SITE_DIR=$SITE_DIR resolves to $real, outside the repository; pages-deploy.yml refuses it."
                 exit 1
               fi
               echo "::warning::SITE_DIR=$SITE_DIR resolves to $real, outside the repository; not scanned."
               exit 0 ;;
          esac
          # Scanned from inside, so the excluded names apply only BELOW the root.
          links=$(cd "$real" && find . \( -name .git -o -name .github -o -name node_modules \) -prune -o -type l -printf '%P -> %l\n')
          if [ -n "$links" ] && [ "$deploy" = 1 ]; then
            echo "::error::symlinks in the site, which pages-deploy.yml refuses; replace them with real files:"
            printf '%s\n' "$links"
            exit 1
          elif [ -n "$links" ]; then
            echo "::warning::symlinks in the site; pages-deploy.yml (Actions-source) refuses them: $(printf '%s; ' "$links")"
          fi

      - name: Diff against PR base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Per-project: paths whose changes warrant a browser run. Includes
          # js/ and styles/ (a source-only change must not skip the browser
          # job) and .github/actions/ (changes to the composites are exercised
          # pre-merge).
          # ANY deployed .html is an entry point, nested ones included: APP_PAGES
          # advertises paths like vendor/console.html, and a matcher anchored to
          # root-level files let a PR touching only that page set ui=false and
          # skip the very ENTRY gate the page exists for.
          # ADD the directories your app FETCHES AT RUNTIME: a data file the page
          # renders (content/*.json that builds a form or a list, say) changes what
          # the browser shows without touching a source file, so a PR touching
          # only it sets ui=false (claude.insurance, 2026-10-15: `^content/`). The
          # name is per-project, so the template cannot list it.
          # ⚠️ LOCAL — tailored to THIS project's layout: the app's JS lives in
          # scripts/ (not js/) and its owner-editable rosters in config/. The
          # template's generic regex would skip the browser suite on every
          # js-only and config-only change.
          # check-ui-viewports.js is in this list because the ONLY job that runs it
          # is ui-tests (the composite invokes it). Matching just
          # .github/scripts/ui-tests/ left a PR that touches only the checker with
          # ui=false, which skips that job, never executes the changed script, and
          # still reaches the green notification — a gate certified by a run that
          # never loaded it (Codex P2, #283). Note .github/actions/ is already here,
          # so editing the composite triggers UI; editing the script it calls did not.
          UI_PATHS: '(\.html$|^scripts/|^styles/|^config/|^\.github/actions/|^\.github/scripts/ui-tests/|^\.github/scripts/check-ui-viewports\.js$|^\.github/workflows/qa\.yml$)'
        run: |
          # A build whose inputs are not listed would let a source-only PR skip
          # the browser job: refuse the configuration rather than guess.
          # Normalised as pages-deploy.yml does: '' and '/' mean the repo root.
          src="${SITE_DIR%/}"; [ -n "$src" ] || src="."
          if [ -n "$BUILD_CMD" ] && [ -z "${BUILD_PATHS//[[:space:]]/}" ]; then
            echo "::error::BUILD_CMD is set but BUILD_PATHS is empty: list the build inputs (workflow env) so a change to them runs the UI suite."
            exit 1
          fi
          # This job gates the LOCAL suite, which serves SITE_DIR as static
          # files, so it needs a static entry point. Enabling it for a repo with
          # no index.html would hand Playwright a directory listing to assert
          # against — a green run that never loaded an application. With a
          # build, SITE_DIR does not exist yet: the browser job checks its
          # index.html after building, and refuses there instead.
          if [ -z "$BUILD_CMD" ] && [ ! -f "$src/index.html" ]; then
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "No index.html yet — skipping browser job."
            exit 0
          fi
          # Non-PR events (push to main) always run UI tests unconditionally.
          if [ "$EVENT" != "pull_request" ]; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event — UI tests run unconditionally."
            exit 0
          fi
          # Capture the diff FIRST and fail loudly if git could not produce it.
          # Piping straight into grep hides the failure: `-e` is suspended inside
          # an `if` condition and there is no pipefail here, so an unresolvable
          # BASE_SHA (shallow fetch, force-push, fork PR) makes git error, grep
          # see nothing, and the job report "No UI-relevant changes" — silently
          # skipping the browser tests on a PR that may be entirely UI.
          if ! files=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "::error::could not diff $BASE_SHA...HEAD — refusing to guess whether UI tests are needed."
            exit 1
          fi
          pattern="$UI_PATHS"
          [ -n "${BUILD_PATHS//[[:space:]]/}" ] && pattern="${pattern}|${BUILD_PATHS}"
          # grep exits 2 on a malformed pattern; inside an `if` that read as
          # "no match" and skipped the suite. Only 0 and 1 are answers.
          rc=0
          printf '%s\n' "$files" | grep -qE -- "$pattern" || rc=$?
          case "$rc" in
            0) echo "ui=true" >> "$GITHUB_OUTPUT"
               echo "UI-relevant changes detected." ;;
            1) echo "ui=false" >> "$GITHUB_OUTPUT"
               echo "No UI-relevant changes — skipping browser job." ;;
            *) echo "::error::UI_PATHS/BUILD_PATHS is not a valid extended regex (grep exit $rc): fix the pattern."
               exit 1 ;;
          esac

      # ⚠️ LOCAL ADDITION — whether the news-client-mutants job runs: whenever the
      # browser suite does (its mutants anchor on scripts/app.js, index.html and
      # styles/, and S75 lives in the kit), and also when only the mutant runner
      # itself changed, which UI_PATHS does not match.
      - name: News client mutants needed?
        id: news
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UI: ${{ steps.diff.outputs.ui }}
        run: |
          if [ "$UI" = "true" ] || [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(git diff --name-only "$BASE_SHA"...HEAD); then
            echo "::error::could not diff $BASE_SHA...HEAD — refusing to guess whether the news client mutants are needed."
            exit 1
          fi
          if printf '%s\n' "$files" | grep -qE '^tools/news-topic-client-mutants\.py$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ⚠️ LOCAL ADDITION — not in the upstream template. Keep it on every refresh.
  # The News topic AI helper's page guards (owner 2026-10-19, with news-checks):
  # tools/news-topic-client-mutants.py breaks each of 41 guards in scripts/app.js,
  # index.html or styles/ in turn and requires S75 to FAIL on desktop and
  # mobile-chrome (Chromium only — it needs no WebKit). It exits non-zero when S75
  # is red on the untouched tree, when a mutant survives, or when an anchor moved
  # (INVALID): an edit to a guarded line means updating the runner in the same PR.
  # Every file is restored and checked byte-identical at the end. Split into
  # two shards (each runs S75's baseline, then every 2nd mutant): the whole run
  # took 8m50s in the build sandbox (2026-10-19), and a hosted runner is slower.
  news-client-mutants:
    name: News helper page mutants (S75, shard ${{ matrix.shard }}/2)
    needs: [project-checks, ui-changes]
    if: needs.ui-changes.outputs.news_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ env.UI_TESTS_DIR }}/package-lock.json

      - name: Install the kit
        run: npm ci --prefix "$UI_TESTS_DIR"

      # Its OWN cache key: the ui-suite composite caches chromium AND webkit under
      # pw-<os>-<lockfile hash>, and a chromium-only save under that key would
      # hand the composite a cache hit with no webkit in it.
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.UI_TESTS_DIR)) }}

      - name: Install Chromium
        working-directory: ${{ env.UI_TESTS_DIR }}
        env:
          HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
          echo "PW_CHROMIUM=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: S75 under every page mutant
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 tools/news-topic-client-mutants.py "--shard=$SHARD/2"

  # ⚠️ LOCAL ADDITION — not in the upstream template. Keep it on every refresh.
  # A precise, PR-scoped, stale-SHA-guarded "green" wake comment (the retired
  # ci-notify.yml watcher fired on any push and could name a superseded commit;
  # upstream deleted it 2026-10, so this job is the only wake signal). It fires
  # for DRAFT PRs too: the draft-PR-immediately flow means most PRs are drafts
  # while CI runs, and a draft gate would silence the very signal this job is for.
  # A failed comment is a visible ::warning::, never a red job — the comment is a
  # wake-up, not the gate — and never silent (a bare `|| true` hid failures).
  # This job re-reads the PR's current head via `gh pr view` immediately before
  # posting, so a comment consumed as an auto-merge signal never names a commit
  # the PR has since moved past.
  notify:
    name: Notify PR on green
    # news-checks, news-client-mutants and server-checks are LOCAL ADDITIONS (see their jobs).
    # The shared Static Checks and UI Tests run INSIDE `qa`, so this job cannot
    # name them: `needs.qa.result` is success only when both of them were. (The
    # suite's "no index.html yet" skip is a step inside that job, so `qa` still
    # reads success then, as the old `ui-tests` skipped arm allowed.)
    needs: [project-checks, qa, ui-changes, news-checks, news-client-mutants, server-checks]
    if: ${{ always() && github.event_name == 'pull_request' && needs.project-checks.result == 'success' && needs.qa.result == 'success' && needs.ui-changes.result == 'success' && needs.news-checks.result == 'success' && needs.server-checks.result == 'success' && (needs.news-client-mutants.result == 'success' || needs.news-client-mutants.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment green on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Skip a stale wake if a newer commit landed while this run executed —
          # the comment is consumed as an auto-merge signal, so it must match the
          # current head (Codex #125). concurrency cancels most such runs; this is
          # the airtight backstop.
          CUR=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$CUR" != "$SHA" ]; then
            echo "PR #$PR head moved ($CUR != $SHA) — skipping stale wake comment."
            exit 0
          fi
          gh pr comment "$PR" --repo "$REPO" \
            --body "$(printf '✅ QA green @ %s — [run](%s)\n\n_Automated wake signal (qa.yml notify job); no action needed._' "${SHA:0:7}" "$RUN_URL")" || echo "::warning::notify failed"
