# qa-response.yml — a CALLER of claude.directives' shared-qa-response.yml (#460
# step 4 pilot, 2026-10-26), pinned to the moving release tag @v1: event-driven
# QA against the live URL, started by repository_dispatch or by hand. The shared
# workflow reads its composites and scripts from claude.directives at the
# called commit and prints "Shared files: akyachtsman/claude.directives@<sha>".
# How it works: claude.directives docs/internal/shared-workflows.md.
#
# ⚠️ Keep this caller through every /refresh-repo: "pilot of #460 step 4".
#
# ⚠️ WHICH REVISION THIS TESTS. A repository_dispatch carries no revision, so
# the suite is the DEFAULT BRANCH's — never the branch a session dispatched
# from; a workflow_dispatch tests the branch picked in the Actions tab. The run
# states the selected SHA in its summary. Use the PR's own qa.yml run for branch
# changes. A ref is deliberately never taken from client_payload.
#
# Dispatch it from a session with the GitHub API:
#   curl -X POST https://api.github.com/repos/<owner>/<repo>/dispatches \
#     -H "Authorization: token <GITHUB_TOKEN>" \
#     -d '{"event_type":"manual-qa-trigger"}'
#
# Required setup: the APP_URL repository variable (the live URL) and, for the
# gated scenarios, the TEST_AUTH_CREDENTIAL secret.

name: QA — Event-Driven Response

on:
  repository_dispatch:
    types:
      - qa-email-received       # triggered when Gmail monitor detects a relevant email
      - test-failure-reported   # triggered when another workflow reports a failure
      - manual-qa-trigger       # triggered manually by an active session

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual session trigger'

# Least privilege: read the repo and run tests.
permissions:
  contents: read

jobs:
  respond:
    uses: akyachtsman/claude.directives/.github/workflows/shared-qa-response.yml@v1
    with:
      tests-dir: .github/scripts/ui-tests
    secrets:
      TEST_AUTH_CREDENTIAL: ${{ secrets.TEST_AUTH_CREDENTIAL }}
      TEST_AUTH_EMAIL: ${{ secrets.TEST_AUTH_EMAIL }}
