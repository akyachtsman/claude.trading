# qa-response.yml — Event-driven QA triggered by repository_dispatch.
# Copy to .github/workflows/qa-response.yml in your project, along with the
# composite actions from templates/actions/ into .github/actions/.
# Triggers on qa-email-received, test-failure-reported, or manual-qa-trigger events.
# Active sessions receive results and act autonomously without human intervention.
#
# Dispatch this workflow from a Claude Code session using the GitHub API:
#   curl -X POST https://api.github.com/repos/<owner>/<repo>/dispatches \
#     -H "Authorization: token <GITHUB_TOKEN>" \
#     -d '{"event_type":"manual-qa-trigger"}'
#
# Required setup:
#   - ⚠️ RULE W1 — this workflow is part of the standard set, and ci-monitor.yml
#     and ci-notify.yml ship watching it. If you OMIT it, remove
#     'QA — Event-Driven Response' from both lists in the same edit.
#     Why: docs/standards/automations.md -> Watcher Rules (W1).
#   - Add TEST_AUTH_CREDENTIAL as a repository secret — skip if the project
#     (email+password AND identifier-first/split-step gates need TEST_AUTH_EMAIL
#      as well — directives#304, #310; without it a split-step gate is not even
#      DETECTED and the authenticated scenarios run against the identifier screen)
#     has no auth; the empty secret makes auth tests self-skip
#   - Add APP_URL as a repository variable (live URL)
#   - Set UI_TESTS_DIR below to the path of your Playwright test directory
#
# ⚠️ WHICH REVISION THIS TESTS. A repository_dispatch carries no revision, so the
# checkout below resolves to the DEFAULT BRANCH — never the branch a session
# dispatched from. (A workflow_dispatch is different: it resolves to the branch
# chosen in the Actions tab, and the summary step below says so.) The suite that runs is main's; the app it runs against is
# whatever APP_URL currently serves. Dispatching from a feature branch does NOT
# test that branch's specs, and the run reports green having tested something
# else. Use the PR's own qa.yml run for branch changes. The job below states the
# tested SHA in its summary so this cannot pass unnoticed.
# A ref is deliberately NOT taken from client_payload: that payload is
# attacker-influenceable (see the injection note further down), and checking out
# an arbitrary ref from it would run that ref's test code.

name: QA — Event-Driven Response

on:
  repository_dispatch:
    types:
      - qa-email-received       # triggered when Gmail monitor detects a relevant email
      - test-failure-reported   # triggered when another workflow reports a failure
      - manual-qa-trigger       # triggered manually by an active session

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual session trigger'

# Least privilege: read the repo and run tests.
permissions:
  contents: read

env:
  UI_TESTS_DIR: .github/scripts/ui-tests

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Event data is passed through env, never interpolated directly into the
      # run: script — a repository_dispatch client_payload is attacker-influenceable,
      # and inlining `${{ github.event.* }}` into a shell body is a script-injection vector.
      - name: Log trigger reason
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "Trigger: $EVENT_NAME"
          echo "Event type: $EVENT_ACTION"
          echo "Payload: $CLIENT_PAYLOAD"

      # Secret scan (composite — single source of truth for the pattern)
      - uses: ./.github/actions/secret-scan

  ui-tests:
    needs: static-checks
    runs-on: ubuntu-latest
    # 120, NOT 90 or 60 (and never 40). This job runs the ui-suite composite: dependency install + playwright
    # install + EVERY project in playwright.config.js + retries + artifact
    # upload, in one sum the composite cannot subdivide.
    #
    # Sized from MEASURED numbers — and the warm figure is a RANGE, not one
    # anchor. An earlier version of this block cited apfp.claude's 16.6min as
    # though it were typical. THREE repos have measured the warm whole-job path
    # (a fourth number, the 21m25s cold install below, comes from
    # claude.directives and measures a different thing — do not count it here):
    #
    #     WARM, whole job, 4-project suites
    #       claude.prop         8m00s    208 tests   cache hit, zero downloads
    #       apfp.claude        16.2-17.0min ~204 specs   three qa-live runs
    #       claude.trading     30m35s    128 tests   run 97234645851
    #
    # That is a 3.8x spread whole-job to whole-job, on nominally similar suites,
    # and test COUNT does not predict it — the slowest repo runs the fewest
    # tests. (#296 quotes 3.7x; that compares claude.trading's 29m34s TEST PHASE
    # against claude.prop's WHOLE JOB. Like for like it is 3.8x.)
    #
    #     cold-cache browser install   21m25s   (claude.directives
    #                                            check-job-bounds.py, rule 3)
    #
    # NOTE the composite installs with `npm install`, not `npm ci` — an earlier
    # version of this block said ci. They differ in resolution and speed, so
    # treat these as measuring THIS path, not a stricter one.
    #     -------------------------------------
    # SIZE FROM THE SLOW END, which is the whole point of carrying a range:
    #     fast end   21m25s + 8m00s   = ~29min  → 60 leaves ~52% headroom
    #     slow end   21m25s + 30m35s  = ~52min  → 60 leaves ~13% headroom
    #
    # claude.trading's cold path is UNMEASURED — they were explicit about not
    # presenting that ~52 as an observation, and it is arithmetic here too. 60
    # still holds, but on the slow end it holds by ~8 minutes, not by the ~58%
    # an average would suggest. A repo at that end should treat adding a project
    # as a bound change, not a config change.
    #
    # ⚠️ 120, NOT 60 — and the raise is not cosmetic. When app.spec.js took S3's
    # per-test budget from 240s to 900s this arithmetic STOPPED FITTING. Projects
    # run SERIALLY (playwright.config.js sets no `workers`; a 2-core runner gives
    # one), so a per-test ceiling is paid once per project — and `retries: 1`
    # means a FAILING scenario pays it twice:
    #
    #     cold install                       21m25s   measured
    #   + test phase, slow end, post-raise    ~38min   claude.trading measured
    #                                                  10.7 + 9.3 + 9.1 for three
    #                                                  profiles; iphone is
    #                                                  unmeasured, inferred ~9.1
    #                                                  from its peer phone profile
    #     -------------------------------------
    #     healthy cold, slow end              ~59.6min  → against 60: no headroom
    #
    # A FAILING S3 does not merely ADD a retry — it REPLACES a healthy run. That
    # ~38min test phase already contains a SUCCESSFUL S3 (~7.8min on the profiles
    # claude.trading measured), so when S3 times out that share is first replaced
    # by the full 900s ceiling and THEN retried at the ceiling:
    #
    #     replace healthy S3 with the ceiling   +7.2min
    #   + retry at the ceiling                  +15min
    #     -------------------------------------
    #     ONE profile failing S3                ~82min
    #     TWO profiles failing S3               ~104min
    #
    # 120 covers both with ~16min spare. THREE or more profiles failing S3 is NOT
    # covered, deliberately: that is not a bound problem, it is S3's budget being
    # wrong for that app — re-size the budget, do not grow the job.
    #
    # WHAT THE ~16min OF SPARE IS FOR, checked rather than assumed. Two rounds
    # raised per-test ceilings: the scenarios that load and authenticate had each
    # been sized for two of their five terms (S2 60s -> 180s -> 240s, S4 and CTRL 30s ->
    # 240s, S1 60s -> 90s, ENTRY 60s -> 90s per page, capped at 5min total), and
    # then the shared preamble's settles became real observation windows, which
    # cost every budget containing them (+40s: NAV 300s -> 360s, DISMISS 900s ->
    # 1200s). A HEALTHY run is unchanged throughout — a ceiling costs nothing
    # until a test hits it.
    #
    # THIRD ROUND, same shape (directives#310): the identifier-first auth step
    # added a bounded SECOND attempt cycle to that shared preamble — +55s, but
    # only on a split-step gate with TEST_AUTH_EMAIL set, so a healthy run on
    # every other app is unchanged again. It cost every budget containing the
    # preamble: S2/S4/CTRL 240s -> 300s, NAV 360s -> 420s. DISMISS absorbed it
    # WITHOUT growing, by spending one fewer navigation reset (NAV_RESET_CAP
    # 3 -> 2) — a navigating trigger is not an overlay trigger, so those resets
    # were already the cheap side of that trade.
    #
    # A FAILING run is where the spare goes, and the scenarios split in two:
    #
    #   SHORT ceilings   S1 90s, S2 300s, S4 300s, CTRL 300s, ENTRY <=300s
    #                    a failure costs <=10min (replace + retry). ONE of these
    #                    fits alongside two profiles failing S3 — and that claim
    #                    is UNCHANGED by the raise above: ENTRY's 300s cap
    #                    already set this class's maximum, so S2/S4/CTRL joined
    #                    the ceiling rather than raising it. 104min + 10min =
    #                    ~114min against 120. What DID change is how often the
    #                    worst case is realized: most projects declare 0-2 entry
    #                    points, so the TYPICAL class maximum was 240s and is
    #                    now 300s.
    #   LONG ceilings    NAV 420s, S3 900s, DISMISS 1200s
    #                    a failure costs 14-40min. NOT covered alongside a
    #                    failing S3 — deliberately, on the same reasoning as
    #                    three failing S3 profiles: two long scenarios failing at
    #                    once means the app or those budgets are wrong, not this
    #                    bound. Re-size there, do not grow the job.
    #
    # ⚠️ CORRECTING THE PREVIOUS VERSION OF THIS PARAGRAPH, which said the spare
    # "absorbs ONE such failure alongside a failing S3" without distinguishing
    # short from long ceilings — and so implied a failing DISMISS was covered. It
    # was not covered then either, at 900s. The omission was in the sentence
    # written to prove the check had been done.
    #
    # Raising a per-test budget without re-checking its enclosing job is exactly
    # the defect this comment block was written for; it applies to the block's
    # own author, twice now.
    #
    # The failure mode all of this exists to prevent, arriving from the other
    # side: GitHub CANCELS the job at the bound, so Playwright never reports the
    # definitive failure and the run reads as inconclusive rather than red.
    # **Raising a per-test budget without raising its enclosing job converts a
    # test failure into a job cancellation.**
    #
    # Capping S3's sweep instead was considered and rejected: it is uncapped BY
    # DESIGN (test.md → "Coverage = controls clicked, not screens visited"), so a
    # cap would cut mandated coverage to fit a bound — the wrong direction, and
    # the same move as loosening a test to get green.
    #
    # COST OF THE FLOOR, stated because it is real: this is a fleet-wide MINIMUM
    # sized for the slow end, so a fast repo (claude.prop, 8min warm) must also
    # allow 120 and will burn that long on a genuine wedge. A repo may set HIGHER,
    # never lower. The trade is deliberate — a bound too tight kills healthy runs
    # and yields an inconclusive signal, which this file treats as the worse
    # failure.
    #
    # The 57-minute figure in claude.directives' check-job-bounds.py header is NOT a sizing input,
    # however tempting the arithmetic. Read it in context: that run "sat 57
    # minutes on a browser install", cited under "an unbounded job that WEDGES".
    # It is the pathology bounds exist to kill. Size to survive it and you have
    # built a bound that cannot trip on its own purpose.
    #
    # 40 was wrong in the other direction, and the failure mode is why this
    # comment is long: a cancelled run is NOT a red one. It reads as
    # inconclusive, so nobody chases it — the same shape as a viewport never
    # instantiated and a live gate nobody watched. Raise this BEFORE adding
    # projects, never after.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Without APP_URL there is nothing to test against: the suite would run
      # every scenario against the placeholder and fail for a config gap rather
      # than a defect. Say so once and stop.
      # Silence is the defect this names: a dispatch from a feature branch
      # otherwise reports green while having run main's specs.
      # Says SELECTED, never "ran" — this step precedes the APP_URL guard and the
      # suite itself, so on an unset APP_URL nothing executes but the checkout and
      # a "ran the specs" summary would be false on the failure path.
      # The default-branch warning is conditional because it is only true for a
      # repository_dispatch: a workflow_dispatch from a feature branch resolves
      # github.sha/ref_name to THAT branch, and warning there would contradict the
      # accurate ref printed one line above and invite discarding a valid run.
      - name: State which revision was selected
        env:
          TESTED_SHA: ${{ github.sha }}
          TESTED_REF: ${{ github.ref_name }}
          IS_DISPATCH: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          {
            echo "### Suite revision"
            echo ""
            echo "Selected the specs at \`$TESTED_SHA\` on \`$TESTED_REF\`."
            if [ "$IS_DISPATCH" = "true" ]; then
              echo ""
              echo "A \`repository_dispatch\` carries no revision, so this is the default"
              echo "branch — **not** the branch any session dispatched from. If you expected"
              echo "a feature branch's specs, they were not selected; use that PR's own"
              echo "\`qa.yml\` run instead."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Suite revision selected: $TESTED_SHA ($TESTED_REF)"

      - name: Require APP_URL
        if: ${{ vars.APP_URL == '' }}
        run: |
          echo "::error::APP_URL repository variable is not set — cannot run the live suite."
          exit 1

      # Blocking, against the live URL.
      - uses: ./.github/actions/ui-suite
        if: ${{ vars.APP_URL != '' }}
        with:
          tests-dir: ${{ env.UI_TESTS_DIR }}
          app-url: ${{ vars.APP_URL }}
          test-auth-credential: ${{ secrets.TEST_AUTH_CREDENTIAL }}
          test-auth-email: ${{ secrets.TEST_AUTH_EMAIL }}
          artifact-name: playwright-results-response-${{ github.run_id }}
          app-pages: ${{ vars.APP_PAGES }}

      # Results are available in the Actions tab for the active session to read
      # and act on via the GitHub MCP tools (pull_request_read, get_job_logs, etc.)
