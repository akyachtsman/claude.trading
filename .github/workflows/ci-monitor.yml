name: CI Monitor

# Event-driven CI failure monitor. Fires the moment the project's QA workflow
# completes; on failure it opens/updates a single deduplicated tracking issue.
# The trigger is the completed workflow run itself, GitHub-side — no session, no
# commit-hook. Uses only GITHUB_TOKEN — no Gmail, no OAuth. workflow_dispatch is
# kept only for manual testing (window scan).
#
# Drop-in: the watched names below match the QA workflows every project in this
# template set installs (qa.yml -> 'QA — Static + UI Tests'; qa-live.yml ->
# 'QA — UI Tests (live)', the authoritative live gate), so copying this verbatim
# needs no edits. Only change the list if you rename those workflows' `name:` —
# and if you do, change it in the SAME pull request, or the monitor goes quiet
# without erroring.
#
# ⚠️ RULE W1 — every watched name must resolve to a workflow this repo has.
# ACTION: all three below ship because /new-repo installs the full standard set.
# If you omit qa-response.yml, remove its name here AND in ci-notify.yml in the
# same edit. Rename a workflow and its watchers in the same PR.
# Why, and the one exception: docs/standards/automations.md -> Watcher Rules (W1).
# Listing watched workflows by name also prevents self-recursion (CI Monitor /
# Codex Monitor are not in the list).
on:
  workflow_run:
    workflows:
      - 'QA — Static + UI Tests'
      - 'QA — UI Tests (live)'
      - 'QA — Event-Driven Response'
    types: [completed]
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: 'How far back to scan for failed runs (minutes) — manual dispatch only'
        required: false
        default: '1440'
permissions:
  actions: read
  issues: write
  # The cancelled discriminator reads the workflow file off the branch
  # (repos/.../contents/...) to test for cancel-in-progress. An explicit
  # permissions block zeroes every unlisted scope, so without this the probe
  # 403s, falls to can_supersede=no, and every HEALTHY supersede alarms — the
  # pairing with qa.yml's concurrency block breaks in the noisy direction.
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Detect failures and report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          # Used ONLY to tell a same-repo run from a fork run. The fork case is
          # deliberately NOT handled — see the probe below for why.
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
          LOOKBACK: ${{ github.event.inputs.lookback_minutes || '1440' }}
          ISSUE_LABEL: 'ci-failure'
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ]; then
            echo "workflow_run: $WR_NAME concluded $WR_CONCLUSION"
            # `cancelled` needs a question asked before it is judged. GitHub reports
            # BOTH a job killed by its timeout AND a run superseded by
            # cancel-in-progress as "cancelled" — and qa-live.yml uses exactly that
            # concurrency setting, so treating every cancellation as a failure would
            # spam the tracking issue on healthy supersedes. Treating none of them as
            # a failure is how a timeout-killed authoritative gate reports nothing at
            # all, which is what happened downstream on 2026-08-19: the run died in
            # setup, said "cancelled", and no alarm fired.
            #
            # ⚠️ "A newer run exists" is COINCIDENCE, not causation, and using it alone
            # re-creates the silent timeout this exists to fix. A workflow with no
            # concurrency block has overlapping runs on a branch as a matter of
            # course — qa.yml is exactly that, and it carries 30-minute job timeouts —
            # so an older run CAN time out while a newer one merely happens to exist.
            # (Caught downstream, apfp.claude 2026-08-19, against this same first
            # attempt.) Suppression therefore requires BOTH:
            #   1. the workflow actually declares cancel-in-progress — without it
            #      nothing could have superseded anything, so a cancel is a timeout
            #      or a human;
            #   2. the newer run was created BEFORE this run ended — one created
            #      afterwards cannot have caused the cancellation.
            # And NO probe may fail toward silence: an unreadable answer alarms.
            if [ "$WR_CONCLUSION" = "cancelled" ]; then
              can_supersede=unknown
              wf_path=$(gh api "repos/$REPO/actions/workflows/${WR_WORKFLOW_ID}" --jq .path 2>/dev/null || true)
              if [ -n "$wf_path" ]; then
                # FORK RUNS ARE NOT CLASSIFIED — they report, and that is deliberate.
                # Two things cannot be made sound from here, and both were found by
                # review rather than reasoned out, so do not "improve" this without
                # re-checking them:
                #   1. A PRIVATE fork is outside this token's scope. contents: read
                #      on the base repo grants nothing in a separate repository, so
                #      the probe 404s and we would guess `no` — the same false alarm
                #      this was meant to remove, now with a misleading cause.
                #   2. The newer-run query below matches on workflow_id + head_branch
                #      only. Two forks using the SAME branch name would let fork B's
                #      run count as superseding fork A's cancelled one — silently
                #      dropping a real failure. That is a false SILENCE, strictly
                #      worse than the false alarm being fixed.
                # So a fork run leaves can_supersede=unknown and is reported. Loud is
                # the correct direction when a probe cannot answer.
                if [ -n "${WR_HEAD_REPO:-}" ] && [ "$WR_HEAD_REPO" != "$REPO" ]; then
                  echo "cancelled on a run from fork ${WR_HEAD_REPO} — not classifiable from the base repo; reporting."
                elif gh api "repos/$REPO/contents/${wf_path}?ref=${WR_SHA}" \
                     -H "Accept: application/vnd.github.raw" 2>/dev/null \
                     | grep -qE '^[[:space:]]*cancel-in-progress:[[:space:]]*true[[:space:]]*$'; then
                  # Same-repo: read at the run's head SHA rather than its branch name,
                  # so the definition is the one AS OF that run, not whatever the
                  # branch holds now.
                  can_supersede=yes
                else
                  can_supersede=no
                fi
              fi

              if [ "$can_supersede" = "no" ]; then
                echo "cancelled, and this workflow declares no cancel-in-progress — nothing could have superseded it."
              elif [ "$can_supersede" = "unknown" ]; then
                echo "cancelled, and the workflow definition could not be read — reporting rather than assuming a supersede."
              else
                newer=$(gh api "repos/$REPO/actions/workflows/${WR_WORKFLOW_ID}/runs?branch=${WR_BRANCH}&per_page=50" \
                  --jq "[.workflow_runs[] | select(.id > ${WR_ID}) | select(.created_at < \"${WR_UPDATED_AT}\")] | length" 2>/dev/null || true)
                if [ -z "$newer" ]; then
                  echo "cancelled, and the supersede probe failed — reporting rather than guessing."
                elif [ "$newer" -gt 0 ]; then
                  echo "cancelled and genuinely superseded: $newer newer run(s) started before it ended. Expected, not reported."
                  exit 0
                else
                  echo "cancelled with no newer run started before it ended — a timeout or a manual cancel."
                fi
              fi
              WR_CONCLUSION=cancelled_unsuperseded
            fi
            case "$WR_CONCLUSION" in
              failure|timed_out|startup_failure|cancelled_unsuperseded)
                body="- **$WR_NAME** on \`$WR_BRANCH\` @ \`${WR_SHA:0:7}\` — [run $WR_ID]($WR_URL)"
                ;;
              *)
                echo "Not a failure. Nothing to report."
                exit 0
                ;;
            esac
          else
            # Manual dispatch: scan a time window.
            since=$(date -u -d "-${LOOKBACK} minutes" +%Y-%m-%dT%H:%M:%SZ)
            echo "Scanning $REPO for failed runs since $since"
            # Same discriminator as the event branch, or the scan re-reports what
            # that branch correctly suppressed: with qa.yml carrying
            # cancel-in-progress, every healthy supersede in the window is a
            # `cancelled` run — flagging them all makes a manual scan cry wolf
            # after any burst of pushes. A cancelled run is kept only when NO
            # newer run of the same workflow+branch was created before it ended
            # (created_at of a later run < updated_at of this one = it CAN have
            # been superseded; nothing newer = a timeout or a human, report it).
            # The per-run cancel-in-progress file probe is skipped here — the
            # window scan is a coarse backstop, and the newer-run test alone
            # only risks under-reporting a cancel that the event branch already
            # classified in real time.
            # TWO fetches, deliberately, and NOT one broadened query.
            #
            # The supersede test below asks whether a NEWER run of the same
            # workflow+branch started before this one ended — so a scan dispatched
            # while that superseding run is STILL RUNNING must be able to see it,
            # or the cancelled predecessor sits alone in its group and opens a
            # false tracking issue. That is issue #240's first case.
            #
            # But simply dropping status=completed is wrong: queued and in-progress
            # runs would then consume slots in this single per_page=100 page, and a
            # COMPLETED failure still inside the lookback could be pushed onto a page
            # never fetched (no --paginate here) and silently dropped. Splitting the
            # fetch keeps the completed page's budget exactly as it was, and adds the
            # in-flight runs the discriminator needs without competing for slots.
            project='{name, id, sha: .head_sha[0:7], branch: .head_branch, url: .html_url,
                      conclusion, workflow_id, head_branch, created_at, updated_at,
                      repo: (.head_repository.full_name // "")}'
            fetch() {
              gh api "repos/$REPO/actions/runs?per_page=100&status=$1" \
                --jq "[.workflow_runs[]
                       | select(.updated_at >= \"$since\")
                       | select(.name != \"CI Monitor\" and .name != \"Codex Monitor\" and .name != \"Pages Monitor\")
                       | $project]"
            }
            # Reported from `completed`; grouped WITH the in-flight ones so a genuine
            # supersede is still recognised. In-flight runs carry a null conclusion,
            # and the report filter names four concrete conclusions, so one is never
            # itself reported.
            runs=$(jq -n \
              --argjson c "$(fetch completed)" \
              --argjson p "$(fetch in_progress)" \
              --argjson q "$(fetch queued)" \
              '$c + $p + $q')
            runs=$(echo "$runs" | jq '[
              # Grouped by REPO too. Without it, two forks using the same branch
              # name share a group, and fork B's run can suppress fork A's cancelled
              # one — silently dropping a real failure. The fork guard on the
              # workflow_run path above does not reach this scan.
              ( group_by([.workflow_id, .head_branch, .repo]) | .[] ) as $g
              | $g[] | . as $r
              | select(
                  (.conclusion=="failure" or .conclusion=="timed_out" or .conclusion=="startup_failure")
                  or (.conclusion=="cancelled" and
                      ([$g[] | select(.created_at > $r.created_at and .created_at < $r.updated_at)] | length) == 0)
                )
              | {name, id, sha, branch, url}
            ]')
            count=$(echo "$runs" | jq 'length')
            echo "Found $count failed run(s) in window"
            [ "$count" -eq 0 ] && { echo "Nothing to report."; exit 0; }
            body=$(echo "$runs" | jq -r '.[]
              | "- **\(.name)** on `\(.branch)` @ `\(.sha)` — [run \(.id)](\(.url))"')
          fi
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # gh issue/label need explicit --repo: no git checkout in this job.
          gh label create "$ISSUE_LABEL" --repo "$REPO" --color B60205 \
            --description "Open CI failure tracked by CI Monitor" 2>/dev/null || true
          # Dedupe across ALL states so a previously-closed issue is reopened
          # rather than duplicated. Pick the most recent tracking issue.
          existing=$(gh issue list --repo "$REPO" --state all --label "$ISSUE_LABEL" \
            --json number,state --jq 'sort_by(.number) | last // empty')
          num=$(echo "$existing" | jq -r '.number // empty')
          state=$(echo "$existing" | jq -r '(.state // "") | ascii_downcase')
          if [ -n "$num" ]; then
            if [ "$state" = "closed" ]; then
              echo "Reopening tracking issue #$num"
              gh issue reopen "$num" --repo "$REPO"
            fi
            echo "Commenting on tracking issue #$num"
            gh issue comment "$num" --repo "$REPO" --body "$(printf 'CI failures detected at %s:\n%s' "$stamp" "$body")"
          else
            echo "Opening new tracking issue"
            gh issue create \
              --repo "$REPO" \
              --title "CI failures detected" \
              --label "$ISSUE_LABEL" \
              --body "$(printf 'CI Monitor detected failing workflow run(s) at %s:\n%s\n\n---\nThis issue is auto-managed by \`.github/workflows/ci-monitor.yml\`.\nClose it once the failures are resolved; new failures will reopen tracking.' "$stamp" "$body")"
          fi
