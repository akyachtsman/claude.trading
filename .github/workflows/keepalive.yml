name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days with no repo commits.
# A weekly empty commit resets that clock for EVERY scheduled workflow in the repo.
# Pushed with a PAT (secrets.KEEPALIVE_PAT) — GITHUB_TOKEN commits don't reliably
# count as the activity that resets the timer.
#
# DO NOT INSTALL THIS UNDER THE STANDARD. It pushes directly to the default
# branch, and every repo on this standard carries a ruleset that requires a pull
# request there with an empty bypass list — so this workflow would fail on every
# run. It is also unnecessary: the 60 days count repository INACTIVITY, not
# elapsed time, so a repo where PRs land is never at risk.
#
# Do NOT resolve the conflict by adding your own account to the bypass list. A
# bypass entry exempts an ACTOR, not a workflow or a token, so it would exempt
# every push that account makes — your sessions included — while the ruleset
# still reads Active.
#
# This file is retained only for a repo outside the standard.
# See MAINTAIN-REPO-USER-INSTRUCTIONS.md -> Branch Protection.

on:
  schedule:
    - cron: '0 9 * * 1'   # weekly — well within 60 days
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN — the push itself uses the PAT from checkout.
permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # An unset PAT gives checkout an empty token and the push below 403s with an
      # opaque error. Fail FAST and LOUD instead: skipping to a green run would
      # hide a config error until GitHub disables scheduled workflows at 60 days,
      # because this repo's monitoring surfaces failed runs, not notices buried in
      # successful ones. A red keepalive is the signal; a green no-op is not.
      - name: Require the keepalive PAT
        env:
          KEEPALIVE_PAT: ${{ secrets.KEEPALIVE_PAT }}
        run: |
          if [ -z "$KEEPALIVE_PAT" ]; then
            echo "::error::KEEPALIVE_PAT is not set, so the 60-day scheduler clock cannot be reset. Add the secret (Settings -> Secrets and variables -> Actions), or delete this workflow if the repo does not need it."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.KEEPALIVE_PAT }}
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — reset 60-day scheduler clock"
          git push
