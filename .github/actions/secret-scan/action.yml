# Copy to .github/actions/secret-scan/action.yml in your project (the qa
# workflows reference it as `uses: ./.github/actions/secret-scan`).
name: 'Secret scan'
description: Canonical repo secret scan — single source of truth for the token pattern.
runs:
  using: composite
  steps:
    - name: Secret scan
      shell: bash
      run: |
        # Canonical secret-scan pattern — keep identical to global.md → Security
        # (upstream's check-secret-scan.js enforces the byte-identical pairing).
        # The last alternative wraps its trailing hyphen in a character class. Every
        # other alternative is regex-shaped and so cannot match its own source text,
        # but a bare literal prefix CAN — and once this scan covers *.md and *.yml it
        # finds the pattern where the pattern is DEFINED and fails on every clean run.
        # A character class matches real tokens identically while not matching the
        # definition, which beats excluding the definition files: an exclusion would
        # also hide a genuine secret pasted into them.
        # (Like check-secret-scan.js, this comment names no token literally — writing
        # one out here would re-create exactly the self-match it describes.)
        # `|| rc=$?` is required: the step runs under `bash -eo pipefail`, where a
        # bare grep exiting 1 (clean — no match) would abort the step.
        # `-l` prints matching FILENAMES ONLY, and that is a security property,
        # not a formatting choice. A token committed by accident is NOT a
        # registered repo secret, so Actions does not mask it: a scan that echoes
        # the matched line publishes the credential it just caught, into a log
        # that outlives the commit and is readable by anyone with repo access.
        # global.md → Security says "never echo secrets in workflow logs" one line
        # above the command that used to do exactly that.
        # `git grep --untracked` reads exactly what could enter a PR: tracked files
        # plus untracked ones that are NOT ignored. `grep -r` read the working tree,
        # so a project's own gitignored `.env.local` — where /new-repo tells it to
        # keep real keys — failed every local run (Codex, #410). A fresh CI checkout
        # holds no ignored files, so CI scans the same set either way. Pathspecs
        # are single-quoted so the SHELL never expands them; git's `*` crosses `/`.
        rc=0
        hits=$(git grep --untracked -lE \
          'pat[A-Za-z0-9]{14}\.[A-Za-z0-9]{40,}|pat[A-Za-z0-9]{17}\.[a-f0-9]{64}|pat[lr]_[A-Za-z0-9]{10,}|sk-[A-Za-z0-9]{20,}|xoxb[-]|sb_secret_[A-Za-z0-9_-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*(c2VydmljZV9yb2xl|NlcnZpY2Vfcm9sZ|zZXJ2aWNlX3JvbG)|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}' \
          -- '*.js' '*.ts' '*.tsx' '*.mjs' '*.html' '*.css' '*.json' '*.md' '*.sh' '*.py' '*.toml' '*.env' '.env.*' '*/.env.*' '*.yml' '*.yaml' ':!*node_modules/*') || rc=$?
        # 0 = a match (a secret), 1 = clean, >=2 = git grep itself failed (128:
        # not a git repository, a bad pathspec). Folding
        # the error case into "clean" is how a scan reports green after failing
        # to run at all.
        if [ "$rc" -eq 0 ]; then
          echo "ERROR: potential API token found in these files:"
          printf '%s\n' "$hits"
          echo "The matching line is deliberately not printed — see the -l note above."
          exit 1
        elif [ "$rc" -ge 2 ]; then
          echo "ERROR: secret scan did not run (git grep exit $rc)"
          exit 1
        fi
