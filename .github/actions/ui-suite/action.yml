# Copy to .github/actions/ui-suite/action.yml in your project (the qa
# workflows reference it as `uses: ./.github/actions/ui-suite`).
#
# Caveats baked into this design:
# - Composite steps cannot carry per-step `timeout-minutes` — bound the run with
#   the CALLING job's `timeout-minutes`. The qa workflows set 120, sized from a
#   cold-cache install at 21m25s plus a warm whole job — and the warm figure is a
#   RANGE, not the single 16.6min this note used to cite: claude.prop 8m00s,
#   apfp.claude 16.2-17.0min, claude.trading 30m35s, a 3.8x spread on nominally
#   similar 4-project suites. Size from the SLOW end, and include a RETRY: with
#   S3's per-test budget now 900s and `retries: 1`, a failing scenario REPLACES
#   its healthy S3 with the ceiling and then retries at it — ~+22min for one
#   profile, ~+44min for two — so the slow end runs ~82min with one failing
#   profile and ~104min with two. That is what took this from 60 to 120; at 60 a
#   healthy slow-end cold run had NO headroom at all. The callers carry the full
#   table, the arithmetic, and what 120 deliberately does not cover. These
#   measure THIS composite's `npm install` path below, not a stricter `npm ci`.
#   That 120 is ENFORCED, not merely documented: check-job-bounds.py rejects any
#   ui-suite caller below it, and templates/workflows/qa.yml invokes the guard in
#   its static-checks job. If you copied this composite, copy
#   templates/scripts/check-job-bounds.py to .github/scripts/ and keep that step,
#   or the 120 reverts to being a number in a comment — which is what it was until
#   #291, and what let three callers sit at 40.
#   The browser install is NOT the whole cost, whatever an earlier version of
#   this note said: those warm figures are the suite's own share, and each scales
#   with the number of projects in playwright.config.js. That is also the best
#   available explanation of the 3.8x spread — same project count, very different
#   apps — so read the range as "your repo sits somewhere in here", not as noise
#   around a mean. Raise the CALLERS before adding projects, never after.
#   If you lower it, measure the cold path first — and note a kill during install
#   also skips the cache save that would have made the next run cheap, so too
#   tight costs a streak rather than a run.
# - `advisory-run` flips ONLY the Playwright run step to continue-on-error;
#   setup/install/server/upload always stay blocking, so a broken install can
#   never pass green.
# - The viewport gate below runs on THIS composite's Node, which `setup-node` pins
#   to 20. That Node cannot import a TypeScript module ANYWHERE IN THE CONFIG'S
#   GRAPH — a `playwright.config.js` that imports a `.ts` helper fails exactly as
#   a `playwright.config.ts` does, so "keep a .js config" is not the escape hatch
#   this note used to claim (Codex, #333 round 11). A project in that position must
#   either raise the pin to 22 (type stripping is on by default from 22.18) or keep
#   the config's ENTIRE import graph in JavaScript. The gate names the condition
#   when it hits ERR_UNKNOWN_FILE_EXTENSION rather than passing quiet — and it is a
#   refusal on a config Playwright's own runner would have loaded, so it counts
#   against the muting risk, not for it.
name: 'UI test suite'
description: >
  Install deps + Playwright, optionally start a bundled local server, run the
  suite, upload results. Single source of truth for the run block shared by
  qa.yml, qa-live.yml and qa-response.yml.
inputs:
  tests-dir:
    description: 'Directory containing playwright.config.js and package.json'
    required: true
  report-path:
    description: >-
      Playwright JSON report, relative to tests-dir — a SINGLE relative path
      inside the workspace, validated before use. The viewport gate reads it
      AFTER the run to check that each declared width had a test SCHEDULED
      under it: a non-skipped result in a project declaring that width. It does
      NOT establish that a page was rendered there — see test.md -> UI coverage
      gates, and directives#348. Your config must DECLARE a json reporter; this
      composite pins where it writes by exporting PLAYWRIGHT_JSON_OUTPUT_FILE,
      so the reporter's own `outputFile` need not match. Leave this empty and the
      validator DERIVES `.agent-reports/playwright-results.json` at the workspace
      root, expressed relative to your `tests-dir` — so it works at any depth. The
      literal default it replaced only worked for a suite three levels down and
      resolved outside the workspace for anything else.
    required: false
    default: ''
  app-url:
    description: 'URL the suite targets (local server or live deploy)'
    required: true
  test-auth-credential:
    description: 'Seeded test credential; empty makes auth tests self-skip'
    required: false
    default: ''
  test-auth-email:
    # ⚠️ LOCAL NOTE — this input is PLUMBED HERE BUT INERT IN THIS REPO'S KIT.
    # claude.trading's app.spec.js has no identifier-first path: detectAuthGate()
    # ignores input[type=email] and detectAndAuth() gets only the credential. The
    # desk's sole gate is a single-step 6-digit PIN, so there is no identifier
    # screen to detect and porting upstream's split-step logic would be dead code.
    # The input and its env pass are KEPT rather than deleted so this file does not
    # drift from the template over something empty; S2 throws if TEST_AUTH_EMAIL is
    # ever actually set, which is what stops it being a silent no-op (Codex P2, #283).
    description: 'Identifier for email+password gates (directives#304); empty keeps the password-only path. NOT truly secret: it is typed into a visible input, so failure screenshots/traces record it — use a throwaway test-account address, never a real person''s'
    required: false
    default: ''
  test-auth-ready-selector:
    description: 'TEST_AUTH_READY_SELECTOR (directives#302, #320): a selector matching whichever auth outcome occurs, so "no gate" is PROVEN rather than windowed. Empty keeps the windowed answer. Not a secret — pass it from a repo VARIABLE, never a secret: a masked selector in a failure message is unreadable'
    required: false
    default: ''
  test-auth-ready-request:
    description: 'TEST_AUTH_READY_REQUEST (directives#302, #320): a substring of the URL of the request whose completion decides the auth outcome. Empty keeps the windowed answer. Not a secret — pass it from a repo VARIABLE'
    required: false
    default: ''
  test-auth-success-selector:
    description: 'TEST_AUTH_SUCCESS_SELECTOR (directives#379): a selector only the signed-in view shows; S2 asserts it is visible after submitting the credential. Empty keeps reading the gate clearing as success. Not a secret — pass it from a repo VARIABLE, never a secret: a masked selector in a failure message is unreadable'
    required: false
    default: ''
  artifact-name:
    description: 'Name for the uploaded results artifact'
    required: true
  start-local-server:
    description: "Set 'true' to serve server-root on :8080 via the bundled http-server"
    required: false
    default: 'false'
  server-root:
    description: 'Directory the local server serves'
    required: false
    default: '.'
  app-pages:
    description: >
      Comma-separated extra HTML entry points (beyond the app root) that the
      ENTRY scenario load-gates, e.g. 'admin.html,vendor/console.html'. Empty
      means the app ships a single page. test.md makes a deployed page with zero
      tests a release blocker, so leaving this empty is a claim, not a default.
    required: false
    default: ''
  grep-invert:
    description: >
      ⚠️ LOCAL ADDITION — not in the upstream template. Keep it on every refresh.
      Playwright --grep-invert pattern excluding scenarios by title. Empty (the
      default) runs everything, so an unset caller behaves exactly as upstream.
      qa.yml passes 'live only' because this project's live-gated scenarios do
      NOT self-skip against a local server: they gate on liveBackendConfigured(),
      which reads the COMMITTED scripts/config.js, and this desk is live — so the
      check returns true even on localhost and S14 then asserts the market lamp
      reads LIVE/EOD within 20s against a CI runner that cannot reach Supabase.
      Without this input the local UI job goes red, since it runs blocking
      (advisory-run 'false'). qa-live.yml leaves it unset — it is the live gate
      and must run those scenarios for real.
    required: false
    default: ''
  advisory-run:
    description: "Set 'true' to make ONLY the run step advisory; setup/install/server/upload stay blocking."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        # Requires a committed package-lock.json at this path — generate it
        # once (`npm install` in tests-dir) and COMMIT it.
        cache-dependency-path: ${{ inputs.tests-dir }}/package-lock.json

    - name: Install test dependencies
      shell: bash
      run: npm install
      working-directory: ${{ inputs.tests-dir }}

    # This suite's ENTIRE viewport coverage is playwright.config.js's `projects`
    # list — one spec set, run at whatever widths that list declares, with exactly
    # one test setting its own (S4, at 390). A list that drifts to phone-only
    # leaves nothing anywhere rendering the app at laptop width, and a green run
    # says nothing about it: a viewport never instantiated produces no failing
    # test. test.md → UI coverage gates, fifth gate.
    #
    # WHERE THIS STEP SITS, and what that costs. It used to run right after the
    # dependency install, BEFORE the browser download, so a broken config failed
    # in seconds rather than after a cold-cache ~20-minute install. That is no
    # longer true and the ordering is now deliberate the other way:
    #
    # This step and `Run Playwright tests` both EVALUATE THE CONFIG. Anything
    # running between them can change what the config observes, so the gate ends
    # up checking one config while the run uses another. Codex reproduced it on
    # #333 with a config branching on whether APP_URL answers: the gate saw a dead
    # URL (server not yet started), the run saw a live one, three projects versus
    # one, and BOTH exited 0. Matching the two steps' env (round 8) and
    # working-directory (round 12) did not help, because the divergence was time,
    # not values.
    #
    # So correctness beat feedback speed: the gate is now the last thing before
    # the run, and check-ui-suite-env.py enforces that adjacency mechanically.
    # THE COST IS REAL — a config this gate would reject now costs a browser
    # install first. It is bounded by the cache step above (the ~20 minutes is a
    # cold-cache figure, not the steady state), and a gate that certifies a
    # different config than the one that runs is worth nothing however fast it is.
    #
    # If the wait becomes intolerable, the fix is a SECOND advisory invocation
    # early on, not moving this one back: the authoritative verdict has to come
    # from the evaluation adjacent to the run.
    #
    # Always blocking — `advisory-run` flips ONLY the run step. There is no silent
    # exit: config missing, import throwing, node_modules absent and zero projects
    # each get their own exit code and their own printed line (#282).
    #
    # Copy templates/scripts/check-ui-viewports.js to .github/scripts/ WITH this
    # composite — this step names it by path and fails at resolution without it,
    # the same coupling check-job-bounds.py has with qa.yml.
    #
    # That coupling is DERIVED now, not just documented here. /refresh-repo greps
    # its callers for `.github/scripts/*` paths, and until 2026-09-01 its pattern
    # demanded a command prefix immediately before `.github/` — which the
    # `"$GITHUB_WORKSPACE/..."` form below does not have, so this file returned no
    # match and a refresh silently omitted the one script this composite cannot
    # run without. This comment was the compensation for that. Keep it as the
    # explanation; check-refresh-derivation.py is the enforcement.
    #
    # THE SAME ENVIRONMENT AS THE RUN STEP, deliberately. This step IMPORTS the
    # config, so it evaluates whatever that config computes from process.env — and
    # the shipped config already reads APP_URL. Give it a thinner environment than
    # `Run Playwright tests` below and the two steps read DIFFERENT configs: a
    # selection key set only when TEST_AUTH_CREDENTIAL is present is invisible
    # here and active there. Reproduced by Codex on #333 with a config setting
    # `shard` under that condition — check step exit 0, run step partitioned.
    # Any variable added to the run step below must be added here too.
    # Browsers are ~400MB and were re-downloaded on EVERY run. This is a BUDGET
    # fix, not a hang fix, and the distinction was measured rather than assumed:
    # downstream the install step SUCCEEDED in 21m25s, and the job then hit its
    # 30-minute ceiling during the tests. Nothing was stuck; the setup simply ate
    # the budget the tests needed (apfp.claude, 2026-08-19, run 32267163505).
    # Caching removes a 21-minute step from a 30-minute job, which is decisive
    # rather than probabilistic.
    #
    # ⚠️ Cache SAVES are branch-scoped; cache RESTORES are not scoped the same
    # way, and conflating the two is the mistake to avoid. A save belongs to the
    # branch that made it, so the first run on a new default branch still misses
    # even when a PR branch populated one — expect one more slow run after
    # adopting this, then hits. A RESTORE reaches further: measured in
    # claude.insurance (2026-08-25, run 32897692210 / job 97964016597, qa-live on
    # main, event=workflow_run), a workflow_run-triggered job RESTORED the exact
    # key a manual workflow_dispatch had written — the same key workflow_run had
    # been DENIED writing three times — two days and three intervening runs
    # later. So narrow any statement of the limit to SAVES; "workflow_run can't
    # use the cache" is wrong, and that correction stands whatever anyone does
    # with it.
    #
    # That makes a dispatch-warms / workflow_run-reads path real and durable. It
    # is deliberately NOT adopted here, and the cost is the reason rather than a
    # footnote: it bought ~15s (install ~22s warm). The cache-hit branch below
    # still runs install-deps, and apt dominates — claude.prop measured 114 MB of
    # apt fetched on two separate runs with BOTH caches hit, i.e. that half is
    # invariant. A manual warming step would trade a documented human action for
    # ~15s against a constant nobody has bounded. Recorded as a finding
    # (claude.directives #303), not as procedure: do not add a warming step
    # without re-measuring.
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: pw-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.tests-dir)) }}

    - name: Install Playwright browsers
      # Both browsers: playwright.config.js defines a webkit project (iPhone 12)
      # alongside chromium (Pixel 5). Installing chromium alone fails that project.
      # On a cache hit the binaries are already present, so only the SYSTEM
      # libraries need installing — those live in /usr/lib and are never cached.
      #
      # ⚠️ "only the system libraries" is NOT the same as "cheap", and reading it
      # that way has already cost a downstream repo a broken run. Chromium's deps
      # are largely preinstalled on the runner image, so `install-deps chromium`
      # finishes in ~30s and invites the conclusion that the step is incidental.
      # Webkit's are not: gstreamer, wayland, hyphen, enchant and flite come to
      # roughly sixty packages.
      #
      # THE MAGNITUDE IS DISPUTED AND BOTH MEASUREMENTS ARE DATED, because runner
      # images change and an undated figure gets read as current:
      #   2026-08-19  apfp.claude     "minutes, not seconds" for webkit's deps
      #   2026-08-23  claude.trading  ~52s and ~56s for Node + npm install +
      #                               cache restore + install-deps BOTH browsers
      #                               + server start, i.e. this step was well
      #                               under a minute on that image, warm path
      # Both may be true of their own day. Treat neither as the current cost.
      #
      # THE SAFETY ADVICE BELOW SURVIVES EITHER FIGURE — only the magnitude is in
      # question, so do not delete it while correcting a number. Do NOT bound this
      # step on the chromium figure, and do NOT make it warn-and-continue — a
      # partial install does not fail here, it fails later as every webkit test
      # dying on a missing `libwayland-server.so.0`, which turns one clear
      # message into fifty confusing ones.
      shell: bash
      run: |
        if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium webkit
        else
          npx playwright install --with-deps chromium webkit
        fi
      working-directory: ${{ inputs.tests-dir }}

    # http-server is a pinned devDependency installed in tests-dir. Invoke its
    # binary by path while staying at the repo root, so server-root still serves
    # the app root AND nothing is fetched at runtime (works under locked egress).
    - name: Start local server
      if: ${{ inputs.start-local-server == 'true' }}
      shell: bash
      env:
        TESTS_DIR: ${{ inputs.tests-dir }}
        SERVER_ROOT: ${{ inputs.server-root }}
      run: |
        "./$TESTS_DIR/node_modules/.bin/http-server" "$SERVER_ROOT" -p 8080 --silent &
        sleep 2

    # IMMEDIATELY BEFORE THE RUN, and after the local server is up. This step
    # evaluates the config, and the run below evaluates it again; anything that
    # differs between those two moments is a config the gate did not check.
    # Round 8 matched their environment, round 12 their working directory —
    # and round 16 found the step ORDER doing the same damage: a config that
    # branches on whether APP_URL answers saw a dead URL here and a live one
    # there. Codex reproduced it exporting three projects while down and one
    # while up, with both this gate and Playwright exiting 0.
    #
    # So: nothing may run between this step and the Playwright command that
    # changes what the config can observe. Adding a step in between is the
    # regression to watch for.

    # A REPORT LEFT BY SOMETHING ELSE IS NOT EVIDENCE ABOUT THIS RUN. Playwright's
    # json reporter writes during onEnd, so a run that aborts early — or a config
    # that quietly stops declaring the reporter — leaves whatever was there
    # before. In a job that invokes this composite twice, or on a runner with a
    # warm workspace, that is a PREVIOUS run's report, and the post-run gate
    # would certify it as this one's (Codex, #347 round 4).
    #
    # Deleting first turns that into the missing-report refusal it should have
    # been: exit 15, CANNOT CHECK, naming the path. Before the sequence below,
    # never between its steps — the three that follow must stay consecutive
    # because two of them evaluate the config.
    # VALIDATE ONCE, BEFORE ANYTHING CONSUMES IT. `report-path` reaches a `rm`,
    # a `--report` argument and a MULTILINE artifact `path:` list. A newline in
    # it becomes a second entry in that list, and the upload runs under
    # `always()` — so a caller deriving this input from untrusted workflow input
    # could have an arbitrary runner-readable file uploaded even on a failing
    # run (Codex, #347 round 8). `..` escaping the workspace is the same class.
    #
    # Refused here rather than sanitised at each use: three consumers with three
    # escaping rules is how one of them ends up wrong, which is the coupling
    # this composite has already been caught by twice.
    - name: Validate report-path
      id: report-path
      shell: bash
      env:
        REPORT_PATH: ${{ inputs.report-path }}
        TESTS_DIR: ${{ inputs.tests-dir }}
      run: python3 "$GITHUB_ACTION_PATH/validate-report-path.py"

    - name: Clear any stale Playwright report
      shell: bash
      # THE SAME ENV AS THE THREE STEPS AFTER IT, and the reason is the guard
      # rather than this step's own needs. Since #347 round 21 this step is part
      # of `check-ui-suite-env.py` -> SEQUENCE: outside it, skipping this step,
      # making it advisory or changing its command all left the guard green,
      # while an uncleared report from a previous invocation satisfied the
      # post-run gate. Folding it in gets every rule at once, and one rule over
      # four steps beats an exemption that has to be re-argued on every read.
      # An `rm` does not import the config, so most of this block is inert here —
      # deliberately, and REPORT_PATH is not: it decides which file is cleared,
      # and it must be the one the other three read and write.
      env:
        APP_URL: ${{ inputs.app-url }}
        TEST_AUTH_CREDENTIAL: ${{ inputs.test-auth-credential }}
        TEST_AUTH_EMAIL: ${{ inputs.test-auth-email }}
        TEST_AUTH_READY_SELECTOR: ${{ inputs.test-auth-ready-selector }}
        TEST_AUTH_READY_REQUEST: ${{ inputs.test-auth-ready-request }}
        TEST_AUTH_SUCCESS_SELECTOR: ${{ inputs.test-auth-success-selector }}
        APP_PAGES: ${{ inputs.app-pages }}
        REPORT_PATH: ${{ steps.report-path.outputs.relative }}
        PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ steps.report-path.outputs.relative }}
      # `--` ENDS OPTION PARSING. A report-path beginning with `-` is a valid
      # relative filename that GNU rm reads as a flag: `rm -f "--preserve-root"`
      # exits 0 and deletes NOTHING, so the stale report survives and the
      # post-run gate certifies it (Codex, #347 round 5). Quoting stops the
      # shell from splitting it; only `--` stops rm from interpreting it.
      run: rm -f -- "$REPORT_PATH" "$RUNNER_TEMP/ui-viewports-declared.json"
      working-directory: ${{ inputs.tests-dir }}

    - name: Check three viewport classes are declared
      shell: bash
      # SAME working-directory AND SAME env AS THE RUN STEP BELOW. Both steps
      # evaluate the config, so both must present it the same world.
      #
      # Four attempts got here, and the first three each satisfied some of the
      # constraints while breaking another:
      #   * export TESTS_DIR to both steps — the Playwright workers inherit it
      #     and it overrides a value the calling job set;
      #   * interpolate ${{ }} into the command — template injection, HIGH;
      #   * take it through env and `unset` it before node — the unset is
      #     textual (an `if false; then unset …; fi` satisfies a regex), and
      #     the step-level assignment SHADOWS an inherited TESTS_DIR that the
      #     run step still sees, so unsetting it created a fresh divergence.
      # Each fix was aimed at the constraint that had just been violated.
      #
      # There is no variable here at all: `working-directory` is a YAML field, so
      # the input is not interpolated into a shell body; GITHUB_WORKSPACE is
      # runner-provided and identical in both steps; `--tests-dir .` is a literal.
      # Nothing to shadow, nothing to unset, nothing to keep in step.
      working-directory: ${{ inputs.tests-dir }}
      env:
        APP_URL: ${{ inputs.app-url }}
        TEST_AUTH_CREDENTIAL: ${{ inputs.test-auth-credential }}
        TEST_AUTH_EMAIL: ${{ inputs.test-auth-email }}
        TEST_AUTH_READY_SELECTOR: ${{ inputs.test-auth-ready-selector }}
        TEST_AUTH_READY_REQUEST: ${{ inputs.test-auth-ready-request }}
        TEST_AUTH_SUCCESS_SELECTOR: ${{ inputs.test-auth-success-selector }}
        APP_PAGES: ${{ inputs.app-pages }}
        # REPORT_PATH is on ALL THREE steps, not just the one that uses it.
        # check-ui-suite-env.py enforces exact env parity across the sequence,
        # and that rule is not bureaucratic: two of these steps IMPORT the
        # config, so a variable present at one evaluation and absent at another
        # is a config that can differ between them (#333 round 10).
        # FROM THE VALIDATED OUTPUT, never the action input — every consumer in
        # this composite now reads a value the validator accepted (#347 r10).
        REPORT_PATH: ${{ steps.report-path.outputs.relative }}
        # Same value on every step of the sequence: check-ui-suite-env.py
        # requires identical env, and two of these steps import the config. See
        # the run step for why this variable is pinned at all (#347 round 18).
        PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ steps.report-path.outputs.relative }}
      run: node "$GITHUB_WORKSPACE/.github/scripts/check-ui-viewports.js" --tests-dir . --declared "$RUNNER_TEMP/ui-viewports-declared.json"

    - name: Run Playwright tests
      shell: bash
      continue-on-error: ${{ inputs.advisory-run == 'true' }}
      env:
        # Deliberately NO TESTS_DIR here, and none on the viewport check above
        # either — neither step declares one, so neither shadows an inherited
        # value and neither can branch on the other's absence.
        # check-ui-suite-env.py enforces that these two mappings match exactly,
        # and that both steps run from the same working-directory.
        APP_URL: ${{ inputs.app-url }}
        TEST_AUTH_CREDENTIAL: ${{ inputs.test-auth-credential }}
        TEST_AUTH_EMAIL: ${{ inputs.test-auth-email }}
        TEST_AUTH_READY_SELECTOR: ${{ inputs.test-auth-ready-selector }}
        TEST_AUTH_READY_REQUEST: ${{ inputs.test-auth-ready-request }}
        TEST_AUTH_SUCCESS_SELECTOR: ${{ inputs.test-auth-success-selector }}
        APP_PAGES: ${{ inputs.app-pages }}
        # REPORT_PATH is on ALL THREE steps, not just the one that uses it.
        # check-ui-suite-env.py enforces exact env parity across the sequence,
        # and that rule is not bureaucratic: two of these steps IMPORT the
        # config, so a variable present at one evaluation and absent at another
        # is a config that can differ between them (#333 round 10).
        # FROM THE VALIDATED OUTPUT, never the action input — every consumer in
        # this composite now reads a value the validator accepted (#347 r10).
        REPORT_PATH: ${{ steps.report-path.outputs.relative }}
        # NEUTRALISE PLAYWRIGHT'S OWN REDIRECT. `PLAYWRIGHT_JSON_OUTPUT_FILE`
        # takes precedence over the json reporter's configured `outputFile`, so a
        # caller whose job or workflow already exports it sends the report
        # somewhere else and the configured file is never written at all.
        # Measured on the shipped 1.62.1: with the variable set the config's
        # `outputFile` produced NO file, and the post-run gate — reading the
        # validated path — exited 15 on a run that had passed (Codex, #347
        # round 18). Setting it to the same validated path is the fix rather
        # than clearing it: an unset variable still leaves the destination to
        # the config, while this pins it to the path every step here agrees on.
        #
        # It does NOT substitute for the config declaring a json reporter.
        # Measured too: with no json reporter in the config, the variable writes
        # nothing. The downstream obligation below is unchanged; what this
        # removes is the obligation for the config's `outputFile` to MATCH.
        # (Resolved against the process cwd, measured — which is this step's
        # working-directory, the same base the gate resolves `--report` against.)
        PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ steps.report-path.outputs.relative }}
        # ⚠️ LOCAL ADDITION — see the grep-invert input's description.
        GREP_INVERT: ${{ inputs.grep-invert }}
      # No --reporter flag: a CLI reporter REPLACES the config's list, which
      # would drop the json reporter and leave playwright-results.json unwritten
      # while the upload step below still claims to publish it.
      #
      # ⚠️ LOCAL ADDITION (grep-invert) — see the input's description. The pattern
      # goes through an env var and is quoted at the point of use — never
      # interpolated into the command line — so a title containing spaces or
      # shell metacharacters stays one argument.
      run: |
        if [ -n "$GREP_INVERT" ]; then
          npx playwright test --grep-invert "$GREP_INVERT"
        else
          npx playwright test
        fi
      working-directory: ${{ inputs.tests-dir }}

    # THE COVERAGE CLAIM COMES FROM THE RUN, not from anything predicted before
    # it. The step above certifies only that three widths are DECLARED; whether
    # the run SCHEDULED anything at them depends on selection keys, .gitignore,
    # shards, reporters, focused tests and globalSetup, and #335 measured that no
    # pre-run observation answers it — `playwright test --list` differs from a
    # run in argv visibility, filterOnly, globalSetup and skip disposition.
    # The run's own JSON report has none of those gaps, because it is the run.
    #
    # SCHEDULED, NOT EXECUTED, and this step's NAME has to say so. It read
    # "Check the run actually exercised all three viewport classes" — the
    # EXECUTED guarantee #347 withdrew — while the gate it invokes prints
    # SCHEDULED and states in its own output that it is not proof a page was
    # rendered. A hook that fails before the test body starts still produces a
    # non-skipped result, so this step can pass with no page and no viewport
    # ever reached (Codex, #347 round 18). The step name is the most prominent
    # carrier of the claim there is: it is what a reader sees in the Actions
    # log without opening anything. Proving the stronger thing is #348.
    #
    # always(): a suite that failed still ran tests, and its report still says
    # which widths the run scheduled. A report that is missing because the run
    # died early is a genuine CANNOT CHECK, and says so rather than passing.
    - name: Check the run scheduled tests at all three viewport classes
      # always() AND the validation having passed — the SAME pair the upload
      # below needs, for the same reason and found the same way. Round 9 gated
      # the upload and left this step on bare `always()`, so a REFUSED
      # report-path still reached it: Codex passed `/dev/zero` and the gate's
      # readFileSync had not returned after a second (#347 round 10). A step
      # that runs after a refusal is a step the validator does not protect,
      # however carefully the validator is written.
      if: ${{ always() && steps.report-path.outcome == 'success' }}
      shell: bash
      # NO continue-on-error, and advisory-run does NOT reach it. The input says
      # "ONLY the run step advisory" and this is not the run step — it is the
      # coverage gate, and making it advisory removes the guarantee exactly when
      # it matters most: a suite that exits 0 having run only desktop tests
      # leaves the composite green with two bands never scheduled (Codex, #347
      # round 6). An advisory RUN is a project choosing to tolerate failing
      # tests; it is not a choice to stop checking which widths were scheduled.
      env:
        APP_URL: ${{ inputs.app-url }}
        TEST_AUTH_CREDENTIAL: ${{ inputs.test-auth-credential }}
        TEST_AUTH_EMAIL: ${{ inputs.test-auth-email }}
        TEST_AUTH_READY_SELECTOR: ${{ inputs.test-auth-ready-selector }}
        TEST_AUTH_READY_REQUEST: ${{ inputs.test-auth-ready-request }}
        TEST_AUTH_SUCCESS_SELECTOR: ${{ inputs.test-auth-success-selector }}
        APP_PAGES: ${{ inputs.app-pages }}
        # REPORT_PATH is on ALL THREE steps, not just the one that uses it.
        # check-ui-suite-env.py enforces exact env parity across the sequence,
        # and that rule is not bureaucratic: two of these steps IMPORT the
        # config, so a variable present at one evaluation and absent at another
        # is a config that can differ between them (#333 round 10).
        # FROM THE VALIDATED OUTPUT, never the action input — every consumer in
        # this composite now reads a value the validator accepted (#347 r10).
        REPORT_PATH: ${{ steps.report-path.outputs.relative }}
        # Same value on every step of the sequence: check-ui-suite-env.py
        # requires identical env, and two of these steps import the config. See
        # the run step for why this variable is pinned at all (#347 round 18).
        PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ steps.report-path.outputs.relative }}
      # THROUGH THE ENVIRONMENT, NOT INTERPOLATED. `${{ }}` is substituted into
      # the script source before bash parses it, so a report-path carrying a
      # quote and a shell operator would execute — the same template-injection
      # class the viewport-check step above records having been caught on once
      # already. Quoting the expression does not help; quoting the VARIABLE does.
      run: node "$GITHUB_WORKSPACE/.github/scripts/check-ui-viewports.js" --tests-dir . --declared "$RUNNER_TEMP/ui-viewports-declared.json" --report "$REPORT_PATH"
      working-directory: ${{ inputs.tests-dir }}

    - name: Upload test results
      # always() AND the validation having passed. `always()` is what makes the
      # artifact useful — a failing suite is exactly when someone wants the
      # screenshots — and it is also what let a rejected report-path be uploaded
      # anyway. Both halves are needed: run whatever else failed, but not on a
      # path that was refused.
      if: ${{ always() && steps.report-path.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        # FROM THE VALIDATED OUTPUT, never the raw input. `report-path` lets a
        # caller move the JSON report and the post-run gate reads it there, so
        # this list has to follow it (#347 round 6) — but interpolating the INPUT
        # here left the exfiltration path open even after round 8 added the
        # validator: this step runs under `always()`, so a refused value still
        # reached the artifact list (Codex, #347 round 9). Two changes, either of
        # which would have closed it, because the `if:` below is a condition
        # someone could relax and this is a value that no longer exists to be
        # misused.
        path: |
          .agent-reports/screenshots/
          ${{ steps.report-path.outputs.path }}
        # `report-path` may legitimately land under a DOT directory — a caller
        # passing `results.json` with the shipped `.github/scripts/ui-tests`
        # tests-dir gets `.github/scripts/ui-tests/results.json`. upload-artifact
        # ignores hidden files by default, so the gate would read the report
        # while the artifact silently omitted it (Codex, #347 round 16).
        include-hidden-files: true
        retention-days: 7
